# Publica la app en GitHub Pages en cada push a main
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el anterior en curso se termina igual
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # La app vive en /CGR-AngularCrm/ dentro de github.io
      - run: npx ng build --base-href /CGR-AngularCrm/

      # Pages no conoce las rutas de Angular: el 404 carga la app y el router muestra la página pedida
      - run: cp dist/cgr-crm/browser/index.html dist/cgr-crm/browser/404.html

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/cgr-crm/browser

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4.0.5
