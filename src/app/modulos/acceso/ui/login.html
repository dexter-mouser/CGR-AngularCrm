<main class="acceso">
  <form class="acceso__tarjeta" (submit)="ingresar($event)">
    <h1 class="acceso__logo">{{ nombreAplicacion }}</h1>
    <p class="acceso__subtitulo">Ingresa para continuar</p>

    <div class="campo">
      <label class="campo__etiqueta" for="usuario">Usuario</label>
      <input
        class="campo__control"
        id="usuario"
        name="usuario"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="next"
      />
    </div>

    <div class="campo">
      <label class="campo__etiqueta" for="clave">Clave</label>
      <div class="campo__grupo">
        <input
          class="campo__control"
          id="clave"
          name="clave"
          [type]="claveVisible() ? 'text' : 'password'"
          autocomplete="current-password"
          enterkeyhint="done"
        />
        <button
          class="campo__ojo"
          type="button"
          aria-controls="clave"
          aria-label="Mostrar clave"
          [attr.aria-pressed]="claveVisible()"
          (click)="alternarClave()"
        >
          <app-icono [nombre]="claveVisible() ? 'ojo-tachado' : 'ojo'" />
        </button>
      </div>
    </div>

    <label class="casilla">
      <input type="checkbox" name="mantener-sesion" />
      Mantener la sesión
    </label>

    <button class="boton-principal" type="submit">Ingresar</button>
  </form>
</main>
